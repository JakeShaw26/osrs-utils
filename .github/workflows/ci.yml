name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege. The default GITHUB_TOKEN can WRITE to the repository; these
# jobs only read it. Narrowing here means a compromised dependency running in
# CI cannot push commits or move tags.
permissions:
  contents: read

# Feature branches are pushed to repeatedly. Cancel superseded runs so a stack
# of agent branches does not queue behind stale work.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# THREE PARALLEL JOBS, NOT ONE SERIAL ONE.
#
# `npm run check` chains its steps with `&&`, so the first failure hides every
# later one: lint fails, tests never run, and you learn about the test failure
# on the *next* push. Two round trips for information one run could give you.
#
# Split, every category reports independently — and within a job, later steps
# use `!cancelled()` so a type error does not hide a formatting error either.
# The cost is one `npm ci` per job instead of one per run; the cache makes that
# cheap, and wall-clock time is now the slowest job rather than the sum.
#
# `npm run check` still exists and is still the right thing to run locally.
# `src/test/ci-workflow.test.ts` asserts the two cannot drift apart.

jobs:
  quality:
    name: types, lint, format
    runs-on: ubuntu-latest
    steps:
      # SUPPLY CHAIN: pinned to full commit SHAs, not tags.
      #
      # `@v4` is a MUTABLE git tag. Whoever controls the action repository can
      # move it to different code at any time, and every workflow using it picks
      # that up on the next run with no diff, no review and no notification. A
      # commit SHA is immutable — the content is fixed by the hash itself.
      #
      # That matters here because these jobs run `npm ci` and `npm run build`,
      # and CI is where CRON_SECRET and DATABASE_URL live once this repo
      # deploys. A moved tag is arbitrary code execution with access to them.
      # This is the tj-actions/changed-files compromise of March 2025 in one
      # line, where a retagged action leaked secrets from tens of thousands of
      # repositories.
      #
      # The trailing comment is the human-readable version — keep it accurate
      # when bumping, because the SHA alone is unreadable. `../dependabot.yml`
      # updates both together, which is the half that stops a pin going stale.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      # `npm ci` not `npm install`: installs exactly the lockfile and fails if
      # package.json and the lockfile disagree. `install` would silently
      # resolve new versions, so CI would stop testing what you actually ship.
      - run: npm ci

      # Grouped because all three are seconds long and share one install.
      # `!cancelled()` rather than `always()`: a real failure still reports the
      # remaining checks, but hitting cancel actually cancels.
      - run: npm run typecheck

      - if: ${{ !cancelled() }}
        run: npm run lint

      - if: ${{ !cancelled() }}
        run: npm run format:check

  test:
    name: tests
    runs-on: ubuntu-latest

    # A REAL POSTGRES, because the rate limiter fails OPEN.
    #
    # `enforceRateLimit()` swallows store errors and allows the request. So a
    # malformed upsert, a missing table and an unreachable database all look
    # identical to a working limiter from outside — every one of them returns
    # 200. Without a database here, `postgres-store.live.test.ts` SKIPS, and a
    # broken limiter ships green.
    #
    # Same image and digest as docker-compose.yml on purpose: CI testing a
    # different Postgres version than developers run is a difference that shows
    # up as an unreproducible CI failure.
    services:
      postgres:
        image: postgres:17.2-alpine@sha256:7e5df973a74872482e320dcbdeb055e178d6f42de0558b083892c50cda833c96
        env:
          POSTGRES_USER: osrs
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: osrs
        ports:
          - 5432:5432
        # Without a healthcheck the runner starts the steps as soon as the
        # container starts, which is several seconds before Postgres accepts
        # connections — `db:migrate` then fails with a connection error that
        # looks like config and is actually a race.
        options: >-
          --health-cmd "pg_isready -U osrs -d osrs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # NOT SECRETS, all four. getEnv() validates its whole schema on first call,
    # so touching the database requires every required variable to be present,
    # not just DATABASE_URL.
    #
    # The values are deliberately obvious fakes. CRON_SECRET has a 16-character
    # minimum and gates nothing in a test run; a realistic-looking value here
    # would teach the habit of putting real ones in a workflow file, which is
    # public. Real secrets belong in repository secrets and are needed by
    # neither this job nor `build`.
    env:
      DATABASE_URL: postgresql://osrs:localdev@localhost:5432/osrs
      DATABASE_URL_UNPOOLED: postgresql://osrs:localdev@localhost:5432/osrs
      WOM_GROUP_ID: '25092'
      CRON_SECRET: ci-not-a-real-secret-placeholder
      OSRS_API_USER_AGENT: 'osrs-clan-toolkit-ci/0.1 (+https://github.com/JakeShaw26/osrs-utils)'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The migration has to run before the tests: the table it creates is what
      # the live store test exercises.
      - run: npm run db:migrate

      # `postgres-store.live.test.ts` now RUNS here rather than skipping. It
      # asserts it has a database whenever CI is set, so deleting the service
      # block above fails the suite instead of quietly reducing coverage.
      - run: npm run test

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # NO SECRETS ARE SET FOR THIS JOB, DELIBERATELY.
      #
      # This is the regression test for hard rule #2: environment validation is
      # lazy (`getEnv()` inside functions), so a build must succeed with no
      # DATABASE_URL and no WOM_GROUP_ID. Module-scope validation would break
      # here — which is exactly the failure this repo hit once already.
      #
      # If this step starts failing, something began reading env at import time.
      # Fix the import, do not add secrets to make it pass.
      - run: npm run build

  # One job to require in branch protection.
  #
  # With three parallel jobs, protecting `main` means naming all three — and a
  # job added later is NOT required until someone remembers to add it, which is
  # a protection gap that looks like protection. Requiring only `ci` means a new
  # job is covered the moment it joins `needs`.
  ci:
    name: ci
    runs-on: ubuntu-latest
    needs: [quality, test, build]
    if: ${{ always() }}
    steps:
      # `needs` alone does not fail this job when a dependency fails — with
      # `always()` it runs regardless, so the result must be checked explicitly.
      # Skipped counts as failure too: it means a dependency never ran.
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          echo "A required job did not succeed:"
          echo "  quality=${{ needs.quality.result }}"
          echo "  test=${{ needs.test.result }}"
          echo "  build=${{ needs.build.result }}"
          exit 1

      - run: echo "All checks passed."
